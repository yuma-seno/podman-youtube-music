services:
  # ─── Chromium リモートデスクトップ (Selkies ベース) ───────────────────────
  chromium:
    build:
      context: ./chromium
      dockerfile: Dockerfile
    container_name: yt_music_kiosk
    security_opt:
      - seccomp=unconfined
      - label=disable
    userns_mode: keep-id
    user: "0:0"
    environment:
      - PUID=${HOST_UID:-1000}
      - PGID=${HOST_GID:-1000}
      - TZ=Asia/Tokyo
      - LC_ALL=ja_JP.UTF-8
      # Firefox メインURLとCDP設定 (--kiosk は初回ログイン後に戻す)
      - FIREFOX_CLI=--kiosk ${URL}
      # 自動ログイン用 (省略可能 - .env に設定した場合のみ有効)
      - GOOGLE_EMAIL=${GOOGLE_EMAIL:-}
      - GOOGLE_PASSWORD=${GOOGLE_PASSWORD:-}
    volumes:
      - ./chromium/custom-cont-init.d:/custom-cont-init.d
      - ./config:/config
    expose:
      - "3000"   # Caddy からのみアクセス (外部非公開)
      - "8080"
    shm_size: "1gb"
    stop_grace_period: 30s   # Chrome が Cookie を書き込むのに十分な時間を確保
    restart: unless-stopped

  # ─── Caddy リバースプロキシ (DuckDNS DNS-01 で Let's Encrypt 自動取得) ─────
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: yt_caddy
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 証明書キャッシュ (永続化)
      - caddy_config:/config
    ports:
      - "0.0.0.0:8443:8443"   # HTTPS (ブラウザからのアクセス)
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.150.0/24
          gateway: 10.89.150.1
